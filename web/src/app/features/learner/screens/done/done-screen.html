<div class="screen__body done">
  <div class="badge" aria-hidden="true">✓</div>

  <div class="title">
    <h2>{{ title() }}</h2>
    <p>{{ subtitle() }}</p>
  </div>

  <div class="stats">
    @if (!store.reviewOnly()) {
      <div class="stat card">
        <span class="stat__value">{{ newWords() | arabicDigits }}</span>
        <span class="stat__label">كلمات جديدة</span>
      </div>
    }
    <div class="stat card">
      <span class="stat__value">{{ store.reviewedCount() | arabicDigits }}</span>
      <span class="stat__label">كلمات راجعتها</span>
    </div>
  </div>

  @if (streak() > 0) {
    <div class="streak">
      <span class="streak__count" aria-hidden="true">{{ streak() | arabicDigits }}</span>
      <div class="streak__text">
        <span class="streak__title">{{ streak() | arabicDigits }} أيام متتالية!</span>
        <span class="streak__sub">عُد غداً لتحافظ على سلسلتك.</span>
      </div>
    </div>
  }
</div>

<div class="screen__footer">
  <button type="button" class="btn-primary" (click)="store.goHome()">العودة للرئيسية</button>
</div>
